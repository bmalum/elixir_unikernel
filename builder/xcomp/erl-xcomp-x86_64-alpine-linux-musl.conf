## Cross-compilation config: build on any Alpine (arm64 or x86_64) host,
## target x86_64 Alpine/musl, using the native clang as cross compiler and an
## x86_64 Alpine sysroot at $SYSROOT (default /sysroot).
## Used via: ./otp_build configure --xcomp-conf=<this file> ...
: "${SYSROOT:=/sysroot}"
erl_xcomp_build=guess
erl_xcomp_host=x86_64-alpine-linux-musl
erl_xcomp_sysroot="$SYSROOT"

CC="clang --target=x86_64-alpine-linux-musl --sysroot=$SYSROOT"
CXX="clang++ --target=x86_64-alpine-linux-musl --sysroot=$SYSROOT"
CPP="clang --target=x86_64-alpine-linux-musl --sysroot=$SYSROOT -E"
LD="clang --target=x86_64-alpine-linux-musl --sysroot=$SYSROOT"
DED_LD="clang --target=x86_64-alpine-linux-musl --sysroot=$SYSROOT"
LDFLAGS="-fuse-ld=lld"
# External deps of the statically linked crypto/asn1 NIFs (all static .a in the sysroot)
LIBS="-lcrypto -lssl -lz -lzstd"
DED_LDFLAGS="-fuse-ld=lld -shared"
AR=llvm-ar
RANLIB=llvm-ranlib
CFLAGS="-O2 -g0"

# Answers to feature tests that cannot run when cross compiling
# (Linux/musl on x86-64; same answers as a native Alpine configure).
erl_xcomp_bigendian=no
erl_xcomp_double_middle_endian=no
erl_xcomp_linux_nptl=yes
erl_xcomp_linux_usable_sigusrx=yes
erl_xcomp_linux_usable_sigaltstack=yes
erl_xcomp_poll=yes
erl_xcomp_kqueue=no
erl_xcomp_putenv_copy=no
erl_xcomp_reliable_fpe=no
erl_xcomp_getaddrinfo=yes
erl_xcomp_gethrvtime_procfs_ioctl=no
erl_xcomp_clock_gettime_cpu_time=yes
erl_xcomp_after_morecore_hook=no
erl_xcomp_dlsym_brk_wrappers=no
erl_xcomp_posix_memalign=yes
erl_xcomp_code_model_small=yes
